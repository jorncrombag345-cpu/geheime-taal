<!DOCTYPE html>
<html lang="nl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>🔐 Secret Language Translator</title>

<style>
@import url('https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700&display=swap');

*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:'Orbitron',sans-serif;
}

body{
height:100vh;
overflow:hidden;
display:flex;
justify-content:center;
align-items:center;
background:#030712;
}

/* Sterren */
.stars{
position:absolute;
width:100%;
height:100%;
background-image:
radial-gradient(white 1px, transparent 1px);
background-size:50px 50px;
animation:moveStars 60s linear infinite;
opacity:0.4;
}

@keyframes moveStars{
from{transform:translateY(0);}
to{transform:translateY(-500px);}
}

/* Glow achtergrond */
.glow1,.glow2{
position:absolute;
border-radius:50%;
filter:blur(100px);
}

.glow1{
width:300px;
height:300px;
background:#00e5ff;
left:-50px;
top:-50px;
}

.glow2{
width:350px;
height:350px;
background:#8b5cf6;
right:-80px;
bottom:-80px;
}

/* Hoofdkaart */
.container{
position:relative;
z-index:10;

width:90%;
max-width:800px;

padding:40px;

background:rgba(255,255,255,0.08);
backdrop-filter:blur(25px);

border:1px solid rgba(255,255,255,0.15);
border-radius:30px;

box-shadow:
0 0 50px rgba(0,229,255,.2),
0 0 100px rgba(139,92,246,.2);

text-align:center;
}

/* Titel */
h1{
color:white;
font-size:3rem;

text-shadow:
0 0 10px #00e5ff,
0 0 20px #00e5ff,
0 0 40px #00e5ff;

margin-bottom:15px;
}

.subtitle{
color:#cbd5e1;
margin-bottom:25px;
}

/* Input */
input{
width:100%;
padding:18px;
font-size:18px;

border:none;
outline:none;

border-radius:15px;

background:rgba(255,255,255,0.1);
color:white;

margin-bottom:20px;
}

input::placeholder{
color:#94a3b8;
}

/* Knop */
button{
width:100%;
padding:18px;

font-size:18px;
font-weight:bold;

cursor:pointer;

border:none;
border-radius:15px;

background:
linear-gradient(
90deg,
#00e5ff,
#8b5cf6
);

color:white;

transition:.3s;
}

button:hover{
transform:scale(1.03);

box-shadow:
0 0 20px #00e5ff,
0 0 40px #8b5cf6;
}

/* Resultaat */
.result{
margin-top:25px;
padding:25px;

border-radius:20px;

background:rgba(255,255,255,.08);

min-height:100px;

display:flex;
align-items:center;
justify-content:center;

font-size:2rem;
color:white;

transition:.3s;
}

/* Stats */
.info{
display:flex;
justify-content:space-between;
margin-top:20px;
color:#cbd5e1;
font-size:14px;
}

.badge{
display:inline-block;
padding:8px 15px;
margin-top:20px;

border-radius:999px;

background:rgba(255,255,255,.08);
color:#fff;
}

/* Animatie */
.pop{
animation:pop .4s ease;
}

@keyframes pop{
0%{
transform:scale(.8);
opacity:0;
}
100%{
transform:scale(1);
opacity:1;
}
}
</style>
</head>

<body>

<div class="stars"></div>
<div class="glow1"></div>
<div class="glow2"></div>

<div class="container">

<h1>🔐 SECRET TRANSLATOR</h1>

<p class="subtitle">
Jullie geheime taal systeem
</p>

<input
id="input"
placeholder="Typ een woord..."
>

<button onclick="translateWord()">
⚡ VERTAAL
</button>

<div id="output" class="result">
Klaar voor vertaling...
</div>

<div class="badge">
🚀 GitHub Edition
</div>

<div class="info">
<span>Aantal woorden: <span id="count"></span></span>
<span>Status: Online</span>
</div>

</div>

<script>

const woordenboek = {

"hoi":"- . .",
"hallo":"- - . .",
"vriend":"* # *",
"test":"+ + -",
"geheim":"@ @ @",
"ja":". -",
"nee":"- .",

"ik":"# .",
"jij":". #",

"docent":". .",
"lol":". . .",
"kippensoep":". . . . ."

};

document.getElementById("count").textContent =
Object.keys(woordenboek).length;

function translateWord(){

const woord =
document
.getElementById("input")
.value
.toLowerCase()
.trim();

const output =
document
.getElementById("output");

if(woordenboek[woord]){

output.textContent =
woordenboek[woord];

}else{

output.textContent =
"❌ WOORD NIET GEVONDEN";

}

output.classList.remove("pop");
void output.offsetWidth;
output.classList.add("pop");

}

document
.getElementById("input")
.addEventListener("keydown",e=>{

if(e.key==="Enter"){
translateWord();
}

});

</script>

</body>
</html>
