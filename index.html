<!DOCTYPE html>
<html lang="nl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Geheime Taal Translator</title>

<style>
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:Arial, sans-serif;
}

body{
    min-height:100vh;
    display:flex;
    justify-content:center;
    align-items:center;
    background:linear-gradient(-45deg,#0f172a,#1e3a8a,#7c3aed,#06b6d4);
    background-size:400% 400%;
    animation:bg 12s ease infinite;
}

@keyframes bg{
    0%{background-position:0% 50%;}
    50%{background-position:100% 50%;}
    100%{background-position:0% 50%;}
}

.container{
    width:90%;
    max-width:700px;
    background:rgba(255,255,255,0.1);
    backdrop-filter:blur(15px);
    border:1px solid rgba(255,255,255,0.2);
    border-radius:25px;
    padding:30px;
    color:white;
    box-shadow:0 8px 32px rgba(0,0,0,0.3);
}

h1{
    text-align:center;
    margin-bottom:20px;
}

textarea{
    width:100%;
    height:120px;
    border:none;
    border-radius:15px;
    padding:15px;
    resize:none;
    font-size:16px;
    margin-bottom:15px;
}

button{
    width:100%;
    padding:15px;
    border:none;
    border-radius:15px;
    cursor:pointer;
    font-size:18px;
    font-weight:bold;
    background:white;
    color:#1e3a8a;
    transition:0.3s;
}

button:hover{
    transform:scale(1.03);
}

#output{
    margin-top:20px;
    background:rgba(255,255,255,0.15);
    padding:15px;
    border-radius:15px;
    min-height:80px;
    word-wrap:break-word;
}
</style>
</head>

<body>

<div class="container">
    <h1>🔐 Geheime Taal Translator</h1>

    <textarea id="input" placeholder="Typ hier je tekst..."></textarea>

    <button onclick="translateText()">Vertalen</button>

    <div id="output">Resultaat verschijnt hier...</div>
</div>

<script>
function translateText() {
    let text = document.getElementById("input").value;

    // Voorbeeldregels
    text = text
        .replaceAll("a","@")
        .replaceAll("e","3")
        .replaceAll("i","!")
        .replaceAll("o","0")
        .replaceAll("s","$");

    document.getElementById("output").textContent = text;
}
</script>

</body>
</html>
