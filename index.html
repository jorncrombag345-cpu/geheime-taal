<!DOCTYPE html>
<html lang="nl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Geheime Taal Translator</title>

<style>
body{
    margin:0;
    font-family:Arial,sans-serif;
    background:linear-gradient(135deg,#0f172a,#1e3a8a,#7c3aed,#06b6d4);
    background-size:400% 400%;
    animation:bg 12s ease infinite;
    display:flex;
    justify-content:center;
    align-items:center;
    height:100vh;
}

@keyframes bg{
    0%{background-position:0% 50%;}
    50%{background-position:100% 50%;}
    100%{background-position:0% 50%;}
}

.box{
    width:90%;
    max-width:600px;
    padding:30px;
    border-radius:20px;
    background:rgba(255,255,255,0.15);
    backdrop-filter:blur(15px);
    color:white;
    text-align:center;
}

input{
    width:90%;
    padding:15px;
    border:none;
    border-radius:10px;
    font-size:18px;
    margin:10px 0;
}

button{
    padding:15px 30px;
    border:none;
    border-radius:10px;
    font-size:18px;
    cursor:pointer;
    margin-top:10px;
}

#output{
    margin-top:20px;
    font-size:24px;
    font-weight:bold;
}
</style>
</head>
<body>

<div class="box">
    <h1>🔐 Geheime Taal Translator</h1>

    <input id="input" placeholder="Typ een woord">

    <br>

    <button onclick="translateWord()">Vertaal</button>

    <div id="output">...</div>
</div>

<script>
const woordenboek = {
    "hoi": "- . .",
    "hallo": "- - . .",
    "vriend": "* # *",
    "test": "+ + -",
    "geheim": "@ @ @",
    "ja": ". -",
    "nee": "- .",
    "ik": "# .",
    "jij": ". #"
};

function translateWord() {
    const woord = document
        .getElementById("input")
        .value
        .toLowerCase()
        .trim();

    const vertaling = woordenboek[woord];

    document.getElementById("output").textContent =
        vertaling || "❌ Woord niet gevonden";
}
</script>

</body>
</html>
