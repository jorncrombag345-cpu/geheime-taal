<!DOCTYPE html>
<html lang="nl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>🔐 Geheime Taal Translator</title>

<style>
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:'Segoe UI',sans-serif;
}

body{
    height:100vh;
    display:flex;
    justify-content:center;
    align-items:center;
    overflow:hidden;
    background:linear-gradient(
        -45deg,
        #0f172a,
        #1e3a8a,
        #7c3aed,
        #06b6d4,
        #2563eb
    );
    background-size:500% 500%;
    animation:bgMove 15s ease infinite;
}

@keyframes bgMove{
    0%{background-position:0% 50%;}
    50%{background-position:100% 50%;}
    100%{background-position:0% 50%;}
}

/* Zwevende bolletjes */
.circle{
    position:absolute;
    border-radius:50%;
    background:rgba(255,255,255,0.1);
    animation:float 15s infinite linear;
}

.circle:nth-child(1){
    width:150px;
    height:150px;
    left:10%;
    top:80%;
}

.circle:nth-child(2){
    width:250px;
    height:250px;
    right:10%;
    top:10%;
}

.circle:nth-child(3){
    width:100px;
    height:100px;
    left:70%;
    bottom:10%;
}

@keyframes float{
    from{
        transform:translateY(0px);
    }
    to{
        transform:translateY(-1200px);
    }
}

.card{
    width:90%;
    max-width:700px;
    padding:35px;
    text-align:center;

    background:rgba(255,255,255,0.12);
    backdrop-filter:blur(20px);

    border:1px solid rgba(255,255,255,0.2);
    border-radius:30px;

    box-shadow:
    0 0 40px rgba(0,0,0,0.3),
    0 0 80px rgba(124,58,237,0.2);
}

h1{
    color:white;
    font-size:3rem;
    margin-bottom:25px;

    text-shadow:
    0 0 10px #fff,
    0 0 20px #60a5fa,
    0 0 40px #60a5fa;
}

.subtitle{
    color:white;
    opacity:0.8;
    margin-bottom:25px;
}

input{
    width:100%;
    padding:18px;
    border:none;
    outline:none;
    border-radius:15px;
    font-size:18px;
    margin-bottom:20px;
}

button{
    width:100%;
    padding:18px;

    border:none;
    border-radius:15px;

    font-size:20px;
    font-weight:bold;

    cursor:pointer;

    background:linear-gradient(
        90deg,
        #60a5fa,
        #8b5cf6
    );

    color:white;

    transition:.3s;
}

button:hover{
    transform:translateY(-3px) scale(1.02);
    box-shadow:0 0 25px rgba(96,165,250,0.8);
}

#output{
    margin-top:25px;
    padding:20px;

    min-height:80px;

    color:white;
    font-size:30px;
    font-weight:bold;

    border-radius:15px;

    background:rgba(255,255,255,0.08);

    display:flex;
    align-items:center;
    justify-content:center;

    transition:.3s;
}

.resultAnimation{
    animation:pop .4s ease;
}

@keyframes pop{
    0%{
        transform:scale(0.8);
        opacity:0;
    }
    100%{
        transform:scale(1);
        opacity:1;
    }
}
</style>
</head>
<body>

<div class="circle"></div>
<div class="circle"></div>
<div class="circle"></div>

<div class="card">

<h1>🔐 Secret Translator</h1>

<p class="subtitle">
Vertaal woorden naar jullie geheime taal
</p>

<input
id="input"
type="text"
placeholder="Typ een woord..."
>

<button onclick="translateWord()">
✨ Vertalen
</button>

<div id="output">
Wacht op invoer...
</div>

</div>

<script>
const woordenboek = {
    "hoi": "- . .",
    "hallo": "- - . .",
    "vriend": "* # *",
    "test": "+ + -",
    "geheim": "@ @ @",
    "ja": ". -",
    "nee": "- .",
    "ik": "# .",
    "jij": ". #",

    "docent": ". .",
    "lol": ". . .",
    "kippensoep": ". . . . ."
};

function translateWord() {

    const woord =
        document.getElementById("input")
        .value
        .toLowerCase()
        .trim();

    const output =
        document.getElementById("output");

    if(woordenboek[woord]){
        output.textContent =
            woordenboek[woord];
    }else{
        output.textContent =
            "❌ Woord niet gevonden";
    }

    output.classList.remove("resultAnimation");

    void output.offsetWidth;

    output.classList.add(
        "resultAnimation"
    );
}

document
.getElementById("input")
.addEventListener("keydown", function(e){
    if(e.key === "Enter"){
        translateWord();
    }
});
</script>

</body>
</html>7
