```html
<!DOCTYPE html>
<html lang="nl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>🔐 Quantum Secret Translator</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

<style>

@import url('https://fonts.googleapis.com/css2?family=Orbitron:wght@400;600;700;900&display=swap');

*{
margin:0;
padding:0;
box-sizing:border-box;
}

:root{
--bg:#020617;
--card:rgba(255,255,255,.07);
--border:rgba(255,255,255,.12);
--cyan:#00e5ff;
--purple:#8b5cf6;
--green:#22c55e;
--red:#ef4444;
--text:#ffffff;
--muted:#94a3b8;
}

body{
font-family:'Orbitron',sans-serif;
background:var(--bg);
height:100vh;
overflow:hidden;
display:flex;
justify-content:center;
align-items:center;
color:var(--text);
position:relative;
}

/* Achtergrond */

.stars{
position:absolute;
width:100%;
height:100%;
background-image:
radial-gradient(white 1px, transparent 1px);
background-size:40px 40px;
opacity:.25;
animation:moveStars 100s linear infinite;
}

@keyframes moveStars{
from{
transform:translateY(0);
}
to{
transform:translateY(-1000px);
}
}

.grid{
position:absolute;
width:200%;
height:200%;
background:
linear-gradient(rgba(0,229,255,.08) 1px, transparent 1px),
linear-gradient(90deg, rgba(0,229,255,.08) 1px, transparent 1px);
background-size:60px 60px;
transform:rotateX(75deg);
animation:gridMove 20s linear infinite;
opacity:.25;
}

@keyframes gridMove{
from{
transform:translateY(0) rotateX(75deg);
}
to{
transform:translateY(60px) rotateX(75deg);
}
}

.glow1,.glow2,.glow3{
position:absolute;
border-radius:50%;
filter:blur(120px);
}

.glow1{
width:400px;
height:400px;
background:#00e5ff;
top:-100px;
left:-100px;
opacity:.35;
}

.glow2{
width:350px;
height:350px;
background:#8b5cf6;
bottom:-100px;
right:-100px;
opacity:.35;
}

.glow3{
width:300px;
height:300px;
background:#22c55e;
top:40%;
left:50%;
transform:translate(-50%,-50%);
opacity:.15;
}

/* Container */

.container{
position:relative;
z-index:10;

width:95%;
max-width:950px;

padding:40px;

background:var(--card);

border:1px solid var(--border);

backdrop-filter:blur(30px);

border-radius:35px;

box-shadow:
0 0 40px rgba(0,229,255,.2),
0 0 80px rgba(139,92,246,.15);

overflow:hidden;
}

/* Header */

.logo{
font-size:3.2rem;
font-weight:900;

text-align:center;

margin-bottom:10px;

background:linear-gradient(
90deg,
var(--cyan),
var(--purple)
);

-webkit-background-clip:text;
-webkit-text-fill-color:transparent;

text-shadow:
0 0 10px rgba(0,229,255,.5);
}

.subtitle{
text-align:center;
color:var(--muted);
margin-bottom:35px;
line-height:1.6;
}

/* Panels */

.top{
display:grid;
grid-template-columns:1fr 1fr;
gap:25px;
}

.panel{
background:rgba(255,255,255,.05);
border:1px solid rgba(255,255,255,.08);
padding:25px;
border-radius:25px;
}

/* Inputs */

label{
display:block;
margin-bottom:12px;
font-size:14px;
color:#cbd5e1;
}

input, textarea, select{
width:100%;

padding:16px;

border:none;
outline:none;

border-radius:15px;

background:rgba(255,255,255,.08);

color:white;

font-size:16px;

margin-bottom:18px;
}

textarea{
resize:none;
height:130px;
}

input::placeholder,
textarea::placeholder{
color:#94a3b8;
}

/* Buttons */

button{
width:100%;
padding:16px;

border:none;
border-radius:15px;

font-size:16px;
font-weight:bold;

cursor:pointer;

transition:.3s;

color:white;

margin-bottom:12px;
}

.translateBtn{
background:linear-gradient(
90deg,
var(--cyan),
var(--purple)
);
}

.translateBtn:hover{
transform:translateY(-3px);

box-shadow:
0 0 20px var(--cyan),
0 0 40px var(--purple);
}

.addBtn{
background:linear-gradient(
90deg,
#22c55e,
#16a34a
);
}

.clearBtn{
background:linear-gradient(
90deg,
#ef4444,
#dc2626
);
}

/* Output */

.output{
margin-top:25px;

padding:25px;

min-height:140px;

border-radius:25px;

background:rgba(255,255,255,.05);

border:1px solid rgba(255,255,255,.08);

display:flex;
align-items:center;
justify-content:center;

text-align:center;

font-size:1.8rem;
line-height:1.7;

word-break:break-word;
}

/* Stats */

.stats{
display:grid;
grid-template-columns:repeat(4,1fr);
gap:15px;

margin-top:25px;
}

.stat{
background:rgba(255,255,255,.05);
padding:18px;
border-radius:20px;
text-align:center;
border:1px solid rgba(255,255,255,.08);
}

.stat h3{
font-size:2rem;
margin-bottom:8px;
color:var(--cyan);
}

.stat p{
font-size:12px;
color:#cbd5e1;
}

/* Notification */

.toast{
position:fixed;
top:25px;
right:25px;

padding:16px 22px;

border-radius:15px;

background:#111827;
border:1px solid rgba(255,255,255,.1);

color:white;

z-index:999;

transform:translateX(300px);

transition:.4s;
}

.toast.show{
transform:translateX(0);
}

/* Footer */

.footer{
margin-top:25px;
text-align:center;
color:#94a3b8;
font-size:13px;
}

/* Animaties */

.pop{
animation:pop .4s ease;
}

@keyframes pop{
0%{
transform:scale(.8);
opacity:0;
}
100%{
transform:scale(1);
opacity:1;
}
}

/* Responsive */

@media(max-width:850px){

.top{
grid-template-columns:1fr;
}

.stats{
grid-template-columns:1fr 1fr;
}

.logo{
font-size:2.3rem;
}

}

</style>
</head>

<body>

<div class="stars"></div>
<div class="grid"></div>

<div class="glow1"></div>
<div class="glow2"></div>
<div class="glow3"></div>

<div class="container">

<div class="logo">
🔐 QUANTUM TRANSLATOR
</div>

<div class="subtitle">
Cyberpunk geheime taal systeem • Encryptie • Decoder • Opslag
</div>

<div class="top">

<div class="panel">

<label>📝 Tekst invoeren</label>

<textarea
id="input"
placeholder="Typ hier geheime woorden..."
autocomplete="off"
></textarea>

<select id="mode">

<option value="translate">
Normaal ➜ Geheim
</option>

<option value="decode">
Geheim ➜ Normaal
</option>

</select>

<button class="translateBtn" onclick="translateText()">
⚡ VERTAAL NU
</button>

<button class="clearBtn" onclick="clearAll()">
🗑️ RESET
</button>

</div>

<div class="panel">

<label>➕ Nieuw woord toevoegen</label>

<input
id="newWord"
placeholder="Normaal woord..."
autocomplete="off"
>

<input
id="newCode"
placeholder="Geheime code..."
autocomplete="off"
>

<button class="addBtn" onclick="addWord()">
🚀 WOORD TOEVOEGEN
</button>

<label>📚 Huidig woordenboek</label>

<textarea
id="dictionaryView"
readonly
></textarea>

</div>

</div>

<div id="output" class="output">
🚀 Klaar voor geheime vertaling...
</div>

<div class="stats">

<div class="stat">
<h3 id="count">0</h3>
<p>WOORDEN</p>
</div>

<div class="stat">
<h3 id="translations">0</h3>
<p>VERTALINGEN</p>
</div>

<div class="stat">
<h3 id="status">ONLINE</h3>
<p>SYSTEEM</p>
</div>

<div class="stat">
<h3 id="modeText">ENC</h3>
<p>MODUS</p>
</div>

</div>

<div class="footer">
🌌 GitHub Quantum Edition • Secret Language AI System
</div>

</div>

<div id="toast" class="toast">
Opgeslagen!
</div>

<script>

/* =========================
WOORDENBOEK
========================= */

let woordenboek = {

"hoi":"- . .",
"hallo":"- - . .",
"vriend":"* # *",
"test":"+ + -",
"geheim":"@ @ @",
"ja":". -",
"nee":"- .",
"ik":"# .",
"jij":". #",
"docent":". .",
"lol":". . .",
"kippensoep":". . . . ."

};

/* =========================
LOCAL STORAGE
========================= */

if(localStorage.getItem("woordenboek")){

woordenboek =
JSON.parse(
localStorage.getItem("woordenboek")
);

}

/* =========================
ELEMENTEN
========================= */

const output =
document.getElementById("output");

const dictionaryView =
document.getElementById("dictionaryView");

const count =
document.getElementById("count");

const translations =
document.getElementById("translations");

const toast =
document.getElementById("toast");

const modeText =
document.getElementById("modeText");

let translationCounter = 0;

/* =========================
UPDATE UI
========================= */

function updateUI(){

count.textContent =
Object.keys(woordenboek).length;

dictionaryView.value = "";

for(const key in woordenboek){

dictionaryView.value +=
key + " = " + woordenboek[key] + "\n";

}

localStorage.setItem(
"woordenboek",
JSON.stringify(woordenboek)
);

}

/* =========================
TOAST
========================= */

function showToast(text){

toast.textContent = text;

toast.classList.add("show");

setTimeout(()=>{

toast.classList.remove("show");

},2000);

}

/* =========================
VERTALEN
========================= */

function translateText(){

const input =
document
.getElementById("input")
.value
.toLowerCase()
.trim();

const mode =
document
.getElementById("mode")
.value;

if(input === ""){

output.textContent =
"⚠️ Vul eerst tekst in";

return;

}

let result = "";

/* NORMAAL -> GEHEIM */

if(mode === "translate"){

const words =
input.split(" ");

words.forEach(word=>{

if(woordenboek[word]){

result +=
woordenboek[word] + " / ";

}else{

result +=
"[?] ";

}

});

modeText.textContent = "ENC";

}

/* GEHEIM -> NORMAAL */

else{

const parts =
input.split("/");

parts.forEach(code=>{

let found = false;

for(const key in woordenboek){

if(
woordenboek[key] === code.trim()
){

result +=
key + " ";

found = true;

}

}

if(!found){

result += "[?] ";

}

});

modeText.textContent = "DEC";

}

output.textContent =
result;

output.classList.remove("pop");
void output.offsetWidth;
output.classList.add("pop");

translationCounter++;

translations.textContent =
translationCounter;

}

/* =========================
WOORD TOEVOEGEN
========================= */

function addWord(){

const word =
document
.getElementById("newWord")
.value
.toLowerCase()
.trim();

const code =
document
.getElementById("newCode")
.value
.trim();

if(word === "" || code === ""){

showToast("⚠️ Vul alles in");

return;

}

woordenboek[word] = code;

updateUI();

showToast("✅ Toegevoegd!");

document.getElementById("newWord").value = "";
document.getElementById("newCode").value = "";

}

/* =========================
RESET
========================= */

function clearAll(){

document.getElementById("input").value = "";

output.textContent =
"🚀 Klaar voor geheime vertaling...";

}

/* =========================
ENTER SUPPORT
========================= */

document
.getElementById("input")
.addEventListener("keydown",e=>{

if(e.key === "Enter" && !e.shiftKey){

e.preventDefault();

translateText();

}

});

/* =========================
INIT
========================= */

updateUI();

</script>

</body>
</html>
```
