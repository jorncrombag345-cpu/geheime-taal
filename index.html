<!DOCTYPE html>
<html lang="nl">
<head>
    <meta charset="UTF-8">
    <title>Geheime Taal Translator</title>
</head>
<body>
    <h1>Geheime Taal Translator</h1>

    <input type="text" id="input" placeholder="Typ iets">
    <button onclick="vertaal()">Vertaal</button>

    <p><strong>Resultaat:</strong> <span id="output"></span></p>

    <script>
        function vertaal() {
            let tekst = document.getElementById("input").value;

            // Vervang dit door de regels van jouw geheime taal
            tekst = tekst
                .replaceAll("a", "@")
                .replaceAll("e", "3");

            document.getElementById("output").textContent = tekst;
        }
    </script>
</body>
</html>
